[project]
name = "quorum"
version = "0.1.1"
description = "Many minds. One answer. A council of local AI models that debate your question."
readme = "README.md"
license = "MIT"
authors = [{ name = "Deepak Vijayan" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line length is the formatter's job; long prompt strings are fine

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
